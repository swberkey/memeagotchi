services:
  - type: web
    name: memeagotchi
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATA_DIR
        value: /app/data
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: memeagotchi-data
      mountPath: /app/data
      sizeGB: 2
